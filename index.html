const GH_KEY="nnote.github.v1";
const GH_DEF={api:"https://api.github.com",pat:"",repo:"",branch:"main",path:"noteris",auto:false,lastSync:null};
let ghCfg=(()=>{ try{ return Object.assign({},GH_DEF,JSON.parse(localStorage.getItem(GH_KEY)||"{}")); }catch(_){ return Object.assign({},GH_DEF); } })();
function saveGh(){ localStorage.setItem(GH_KEY,JSON.stringify(ghCfg)); }
function ghReady(){ return ghCfg.api&&ghCfg.repo&&ghCfg.pat; }
function syncRoot(){ return (ghCfg.path||"noteris").trim().replace(/^\/+|\/+$/g,""); }
function ghHeaders(){ return {Authorization:"Bearer "+ghCfg.pat,Accept:"application/vnd.github+json","Content-Type":"application/json"}; }
function b64encode(str){ const u=new TextEncoder().encode(str); let bin=""; u.forEach(c=>bin+=String.fromCharCode(c)); return btoa(bin); }
function b64decode(b64){ const bin=atob(b64.replace(/\s/g,"")); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return new TextDecoder().decode(u); }
async function ghFetchJSON(path,method,body){
  const api=ghCfg.api.replace(/\/+$/,"");
  const r=await fetch(api+path,{method:method||"GET",headers:ghHeaders(),body:body?JSON.stringify(body):undefined});
  if(r.status===404)return null;
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.status===204?{}:r.json();
}
function ghFileName(s,extra){
  let n=(s||"").trim()
    .replace(/[^\p{L}\p{N}\-_ ]+/gu,"-").replace(/\s+/g,"-").replace(/-+/g,"-")
    .replace(/^-+|-+$/g,"").slice(0,48);
  if(!n)n="untitled";
  return n+"--"+extra;
}
function ghIsManaged(path){
  const root=syncRoot();
  if(root){
    if(path===root+"/config.json")return true;
    return path.startsWith(root+"/note/")||path.startsWith(root+"/skills/")||path.startsWith(root+"/todo/")||path.startsWith(root+"/habits/");
  }
  return path==="config.json"||path.startsWith("note/")||path.startsWith("skills/")||path.startsWith("todo/")||path.startsWith("habits/");
}
function ghBuildFiles(){
  const root=syncRoot();
  const files=new Map();
  const put=(rel,content)=>files.set(root?root+"/"+rel:rel,content);
  put("config.json",JSON.stringify({meta:{app:"Noteris Workbench",version:2,exportedAt:new Date().toISOString()},lang:state.lang,folders:state.folders||[],dash:state.dash||[]},null,2));
  put("habits/habits.json",JSON.stringify(state.habits||[],null,2));
  state.skills.forEach(sk=>put("skills/"+ghFileName(sk.name,sk.id.slice(-6))+".json",JSON.stringify(sk,null,2)));
  put("todo/tasks.json",JSON.stringify(state.todos,null,2));
  state.notes.forEach(n=>{
    const f=normFolder(n.folder);
    const dir=f? "note/"+f.split("/").map(seg=>ghFileName(seg,"d").replace(/--d$/,"")).join("/") : "note";
    const fm="---\nid: "+n.id+"\nupdated: "+n.updatedAt+"\ntitle: "+b64encode(n.title||"")+"\n---\n\n"+(n.body||"");
    put(dir+"/"+ghFileName(n.title,"x").replace(/--x$/,"")+"--"+n.id.slice(-6)+".md",fm);
  });
  return files;
}
async function ghPush(silent){
  if(!ghReady()){ if(!silent)toast(t("ghNeedCfg"),true); return false; }
  try{
    const files=ghBuildFiles();
    let pushed=0;
    for(const [path,content] of files){
      const cur=await ghFetchJSON(`/repos/${ghCfg.repo}/contents/${encodeURI(path)}?ref=${encodeURIComponent(ghCfg.branch)}`);
      if(cur&&cur.content&&b64decode(cur.content)===content)continue;
      const body={message:"Noteris sync: "+path,content:b64encode(content),branch:ghCfg.branch};
      if(cur&&cur.sha)body.sha=cur.sha;
      await ghFetchJSON(`/repos/${ghCfg.repo}/contents/${encodeURI(path)}`,"PUT",body);
      pushed++;
    }
    let deleted=0;
    const tree=await ghFetchJSON(`/repos/${ghCfg.repo}/git/trees/${encodeURIComponent(ghCfg.branch)}?recursive=1`);
    if(tree&&Array.isArray(tree.tree)){
      for(const node of tree.tree){
        if(node.type!=="blob"||!ghIsManaged(node.path)||files.has(node.path))continue;
        await ghFetchJSON(`/repos/${ghCfg.repo}/contents/${encodeURI(node.path)}`,"DELETE",{message:"Noteris sync: remove "+node.path,sha:node.sha,branch:ghCfg.branch});
        deleted++;
      }
    }
    ghCfg.lastSync=Date.now(); saveGh();
    if(!silent){ toast(tf("ghPushDone",{n:pushed,d:deleted})); updGhSyncLbl(); }
    return true;
  }catch(e){ if(!silent)toast(t("ghErr")+(e.message||""),true); return false; }
}
function ghParseNote(text){
  const m=text.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  if(!m)return null;
  const head={};
  m[1].split("\n").forEach(line=>{ const i=line.indexOf(":"); if(i>0)head[line.slice(0,i).trim()]=line.slice(i+1).trim(); });
  let title=""; try{ title=b64decode(head.title||""); }catch(_){}
  return { id:head.id||uid(), title, body:m[2], updatedAt:parseInt(head.updated,10)||Date.now() };
}
async function ghPull(){
  if(!ghReady()){ toast(t("ghNeedCfg"),true); return; }
  try{
    const tree=await ghFetchJSON(`/repos/${ghCfg.repo}/git/trees/${encodeURIComponent(ghCfg.branch)}?recursive=1`);
    if(!tree||!Array.isArray(tree.tree))throw new Error("tree");
    const nodes=tree.tree.filter(n=>n.type==="blob"&&ghIsManaged(n.path));
    if(!nodes.length)throw new Error("404");
    const files=new Map();
    for(const node of nodes){
      const j=await ghFetchJSON(`/repos/${ghCfg.repo}/contents/${encodeURI(node.path)}?ref=${encodeURIComponent(ghCfg.branch)}`);
      if(j&&j.content)files.set(node.path,b64decode(j.content));
    }
    const root=syncRoot();
    const data={skills:[],notes:[],todos:[],habits:[],lang:state.lang,folders:[],dash:null};
    for(const [path,text] of files){
      const rel=root?(path.startsWith(root+"/")?path.slice(root.length+1):null):path;
      if(rel===null)continue;
      if(rel==="config.json"){ try{ const c=JSON.parse(text); if(c&&c.lang)data.lang=c.lang; if(Array.isArray(c.folders))data.folders=c.folders; if(Array.isArray(c.dash)&&c.dash.length)data.dash=c.dash; }catch(_){} }
      else if(rel==="habits/habits.json"){ try{ const a=JSON.parse(text); if(Array.isArray(a))data.habits=a; }catch(_){} }
      else if(rel.startsWith("skills/")&&rel.endsWith(".json")){ try{ data.skills.push(JSON.parse(text)); }catch(_){} }
      else if(rel==="todo/tasks.json"){ try{ const a=JSON.parse(text); if(Array.isArray(a))data.todos=a; }catch(_){} }
      else if(rel.startsWith("note/")&&rel.endsWith(".md")){
        const nt=ghParseNote(text); if(!nt)continue;
        const sub=rel.slice(5), i=sub.lastIndexOf("/");
        nt.folder=i>0?sub.slice(0,i):"";
        data.notes.push(nt);
      }
    }
    if(!data.skills.length&&!data.notes.length&&!data.todos.length)throw new Error("format");
    confirmDialog(t("ghTitle"),tf("ghPullAsk",{n:files.size})).then(ok=>{
      if(!ok)return;
      state={lang:data.lang||state.lang,skills:data.skills,notes:data.notes,todos:data.todos,habits:data.habits||[],folders:data.folders||[],dash:data.dash||state.dash,shortcut:state.shortcut};
      save(); currentNoteId=null; editingId=null; applyI18n(); renderAll();
      ghCfg.lastSync=Date.now(); saveGh(); toast(tf("ghPullDone",{n:files.size})); updGhSyncLbl();
    });
  }catch(e){ toast(t("ghErr")+(e.message==="404"?"404":e.message),true); }
}
let ghSyncTimer=null;
afterSaveHooks.push(()=>{
  if(!ghCfg.auto||!ghReady())return;
  clearTimeout(ghSyncTimer);
  ghSyncTimer=setTimeout(()=>ghPush(true),4000);
});

function b64FromBuf(buf){ const u=new Uint8Array(buf); let bin=""; const CH=0x8000; for(let i=0;i<u.length;i+=CH)bin+=String.fromCharCode.apply(null,u.subarray(i,i+CH)); return btoa(bin); }
function bufFromB64(b64){ let s=b64.replace(/\s/g,""); s+="=".repeat((4-s.length%4)%4); const bin=atob(s); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return u; }

/* ================= LAN TRANSFER (WebRTC, fully offline) ================= */
/* No CDN, no signaling server: SDP codes are exchanged manually (paste/copy).
   Works on the same LAN via ICE host candidates; iceServers is empty. */
let trPC=null, trDC=null, trRole=null, trMode="send";
let trOfferCode="", trAnswerCode="", trPeerIp="";
let trRx={buf:[],size:0,kind:"",name:"",got:0};

function setTrStatus(n){
  const el=$("#tr-status"); if(!el)return;
  el.className="tr-status"+(n===2?" on":n===1?" mid":"");
  $("#tr-status-txt").textContent=t(n===2?"trStatus2":n===1?"trStatus1":"trStatus0");
  const cb=$("#btn-tr-close"); if(cb)cb.style.display=trPC?"":"none";
}
function trNewPC(){
  const pc=new RTCPeerConnection({iceServers:[]});
  pc.onconnectionstatechange=()=>{
    if(pc.connectionState==="connected")return;
    if(["failed","disconnected","closed"].includes(pc.connectionState)){
      if(trPC===pc){ toast(t(pc.connectionState==="failed"?"trFailHint":"trClosed"),true); trCleanup(); setTrStatus(0); renderTrPanel(); }
    }
  };
  return pc;
}
function trGather(pc){
  if(pc.iceGatheringState==="complete")return Promise.resolve();
  return new Promise(res=>{
    const to=setTimeout(res,8000);
    pc.addEventListener("icegatheringstatechange",()=>{ if(pc.iceGatheringState==="complete"){clearTimeout(to);res();} });
  });
}
/* Compact code: only the essentials of the SDP are exchanged (ICE creds,
   DTLS fingerprint, LAN host candidates), rebuilt into a full SDP locally.
   Result is a single short line (~200 chars) that can be dictated or typed.
   Legacy full-SDP codes (plain base64) are still accepted on input. */
/* Extract only what a direct LAN connection needs from a real SDP. */
function trPack(desc){
  const sdp=desc.sdp;
  const pick=re=>{ const m=sdp.match(re); return m?m[1]:null; };
  const ufrag=pick(/a=ice-ufrag:(\S+)/), pwd=pick(/a=ice-pwd:(\S+)/);
  const f=(pick(/a=fingerprint:sha-256 (.*)/)||"").replace(/:/g,"");
  const setup=pick(/a=setup:(\S+)/)||(desc.type==="offer"?"actpass":"active");
  const seen=new Set(), cands=[];
  sdp.split(/\r?\n/).forEach(l=>{
    if(!l.startsWith("a=candidate:"))return;
    const p=l.slice(12).split(" ");
    if(p[1]!=="1"||p[2]!=="udp")return;
    const ip=p[4], port=parseInt(p[5],10);
    if(!(/^\d{1,3}(\.\d{1,3}){3}$/.test(ip)||/^[0-9a-fA-F-]{8,}\.local$/.test(ip)))return;
    if(ip.startsWith("127."))return;
    const key=ip+":"+port;
    if(seen.has(key))return;
    seen.add(key);
    cands.push({ip:ip,port:port});
  });
  if(!ufrag||!pwd||f.length!==64||!cands.length)return null;
  return {t:desc.type,u:ufrag,p:pwd,f:f,s:setup,c:cands};
}
/* Rebuild a complete, standards-shaped SDP from the packed essentials. */
function trBuildSDP(o){
  const port=o.c[0]?o.c[0].port:9;
  const fp=o.f.replace(/../g,"$&:").replace(/:$/,"");
  const cands=o.c.map((c,i)=>"a=candidate:"+(i+1)+" 1 udp 2122260223 "+c.ip+" "+c.port+" typ host").join("\r\n");
  const sdp=[
    "v=0",
    "o=- 0 0 IN IP4 0.0.0.0",
    "s=-",
    "t=0 0",
    "a=group:BUNDLE 0",
    "a=msid-semantic: WMS",
    "m=application "+port+" UDP/DTLS/SCTP webrtc-datachannel",
    "c=IN IP4 0.0.0.0",
    "a=ice-ufrag:"+o.u,
    "a=ice-pwd:"+o.p,
    "a=ice-options:trickle",
    "a=fingerprint:sha-256 "+fp,
    "a=setup:"+o.s,
    "a=mid:0",
    "a=sctp-port:5000",
    "a=max-message-size:262144",
    cands
  ].join("\r\n")+"\r\n";
  return {type:o.t,sdp:sdp};
}
/* v2: binary packing (8 bits per char, IPv4 as 4 raw bytes, fingerprint raw).
   ~100-150 chars depending on candidates. Falls back to null -> legacy code. */
function trCode(desc){
  const o=trPack(desc); if(!o)return null;
  const ub=new TextEncoder().encode(o.u), pb=new TextEncoder().encode(o.p);
  const fpb=new Uint8Array(32);
  for(let i=0;i<32;i++)fpb[i]=parseInt(o.f.substr(i*2,2),16);
  const chunks=[]; let total=0;
  const add=a=>{ chunks.push(a); total+=a.length; };
  add(new Uint8Array([0x40|(o.t==="answer"?0x10:0)|(o.s==="active"?0x04:o.s==="passive"?0x08:0), o.c.length, ub.length]));
  add(ub);
  add(new Uint8Array([pb.length])); add(pb);
  add(fpb);
  o.c.forEach(c=>{
    if(/^\d{1,3}(\.\d{1,3}){3}$/.test(c.ip)){
      add(new Uint8Array([0])); add(new Uint8Array(c.ip.split(".").map(Number)));
    }else{
      const nb=new TextEncoder().encode(c.ip);
      add(new Uint8Array([1,nb.length])); add(nb);
    }
    add(new Uint8Array([c.port>>8,c.port&255]));
  });
  const buf=new Uint8Array(total); let off=0;
  chunks.forEach(c=>{ buf.set(c,off); off+=c.length; });
  return "N2."+b64FromBuf(buf).replace(/=+$/,"");
}
/* Optional manual peer IP: real-IP host candidates replace/augment the (often
   unresolvable cross-device) mDNS ones. Symmetric: each side enters the other's IP. */
function trApplyIp(desc){
  const ip=(trPeerIp||"").trim();
  if(!/^\d{1,3}(\.\d{1,3}){3}$/.test(ip))return desc;
  const ports=[];
  desc.sdp.split(/\r?\n/).forEach(l=>{
    const m=l.match(/^a=candidate:\S+ \S+ \S+ \S+ \S+ (\d+) typ host/);
    if(m&&!ports.includes(+m[1]))ports.push(+m[1]);
  });
  if(!ports.length)return desc;
  const lines=desc.sdp.split(/\r?\n/).filter(l=>l&&!l.startsWith("a=candidate:"));
  ports.forEach((p,i)=>{ lines.push("a=candidate:"+(i+1)+" 1 udp 2122260223 "+ip+" "+p+" typ host"); });
  return {type:desc.type,sdp:lines.join("\r\n")+"\r\n"};
}
/* Input: N2. binary | N1. JSON | legacy full-SDP base64. Output: RTCSessionDescriptionInit */
function trDecode(codeRaw){
  const code=codeRaw.trim();
  if(code.startsWith("N2.")){
    const b=bufFromB64(code.slice(3));
    let off=0;
    const b0=b[off++], nc=b[off++], ul=b[off++];
    const u=new TextDecoder().decode(b.subarray(off,off+ul)); off+=ul;
    const pl=b[off++];
    const p=new TextDecoder().decode(b.subarray(off,off+pl)); off+=pl;
    const f=[...b.subarray(off,off+32)].map(x=>x.toString(16).padStart(2,"0")).join(""); off+=32;
    const setup=(b0&0x0C)===0x04?"active":(b0&0x0C)===0x08?"passive":"actpass";
    const c=[];
    for(let i=0;i<nc;i++){
      const t=b[off++];
      let ip;
      if(t===0){ ip=[...b.subarray(off,off+4)].join("."); off+=4; }
      else{ const nl=b[off++]; ip=new TextDecoder().decode(b.subarray(off,off+nl)); off+=nl; }
      const port=(b[off]<<8)|b[off+1]; off+=2;
      c.push({ip:ip,port:port});
    }
    return trBuildSDP({t:(b0&0x10)?"answer":"offer",u:u,p:p,f:f,s:setup,c:c});
  }
  if(code.startsWith("N1.")){
    const o=JSON.parse(new TextDecoder().decode(bufFromB64(code.slice(3))));
    return trBuildSDP({t:o.t==="o"?"offer":"answer",u:o.u,p:o.p,f:o.f,s:o.s,
      c:(o.c||[]).map(x=>{ const q=x.split(":"); return {ip:q[0],port:parseInt(q[1],10)}; })});
  }
  return JSON.parse(new TextDecoder().decode(bufFromB64(code)));
}
function trCleanup(){
  if(trDC){ try{trDC.close();}catch(_){} trDC=null; }
  if(trPC){ const pc=trPC; trPC=null; pc.onconnectionstatechange=null; try{pc.close();}catch(_){} }
  trOfferCode=""; trAnswerCode=""; trRx={buf:[],size:0,kind:"",name:"",got:0};
}
function trCopyTA(id){
  const ta=$(id); if(!ta)return;
  ta.focus(); ta.select();
  try{
    navigator.clipboard.writeText(ta.value).then(()=>toast(t("trCopied"))).catch(()=>toast(t("trCopyManual")));
  }catch(_){ toast(t("trCopyManual")); }
}
function trLog(msg){
  const log=$("#tr-log"); if(!log)return;
  const line=document.createElement("div");
  line.textContent="["+new Date().toLocaleTimeString()+"] "+msg;
  log.appendChild(line);
  while(log.children.length>40)log.removeChild(log.firstChild);
  log.scrollTop=log.scrollHeight;
}
function trProg(got,size){
  const el=$("#tr-prog"); if(!el)return;
  const pct=size?Math.min(100,Math.round(got/size*100)):(got?50:0);
  el.innerHTML='<div class="tr-prog"><div class="tr-prog-fill" style="width:'+pct+'%"></div></div><div class="tr-prog-txt">'+fmtSize(got)+" / "+fmtSize(size||0)+"</div>";
}
function trWireDC(dc){
  dc.binaryType="arraybuffer";
  dc.onopen=()=>{ setTrStatus(2); renderTrPanel(); trLog(t("trStatus2")); };
  dc.onclose=()=>{ };
  dc.onmessage=e=>trOnMsg(e);
}
async function trGenOffer(){
  trCleanup();
  trRole="send"; trMode="send";
  trPC=trNewPC();
  trDC=trPC.createDataChannel("noteris",{ordered:true});
  trWireDC(trDC);
  setTrStatus(1);
  try{
    await trPC.setLocalDescription(await trPC.createOffer());
    await trGather(trPC);
    trOfferCode=trCode(trPC.localDescription)||b64FromBuf(new TextEncoder().encode(JSON.stringify(trPC.localDescription)));
  }catch(e){ toast(t("trBadCode"),true); trCleanup(); setTrStatus(0); }
  renderTrPanel();
}
async function trConnectAnswer(){
  const ta=$("#tr-answer-in"); if(!ta||!trPC)return;
  const ipEl=$("#tr-peer-ip"); if(ipEl)trPeerIp=ipEl.value;
  try{ await trPC.setRemoteDescription(trApplyIp(trDecode(ta.value))); }
  catch(e){ toast(t("trBadCode"),true); }
}
async function trGenAnswer(){
  const ta=$("#tr-offer-in"); if(!ta)return;
  const ipEl=$("#tr-peer-ip"); if(ipEl)trPeerIp=ipEl.value;
  let desc;
  try{ desc=trApplyIp(trDecode(ta.value)); }catch(e){ toast(t("trBadCode"),true); return; }
  trCleanup();
  trRole="recv"; trMode="recv";
  trPC=trNewPC();
  trPC.ondatachannel=e=>{ trDC=e.channel; trWireDC(trDC); };
  setTrStatus(1);
  try{
    await trPC.setRemoteDescription(desc);
    await trPC.setLocalDescription(await trPC.createAnswer());
    await trGather(trPC);
    trAnswerCode=trCode(trPC.localDescription)||b64FromBuf(new TextEncoder().encode(JSON.stringify(trPC.localDescription)));
  }catch(e){ toast(t("trBadCode"),true); trCleanup(); setTrStatus(0); }
  renderTrPanel();
}
async function trSendBytes(u8,kind,name){
  if(!trDC||trDC.readyState!=="open")return;
  const label=name||t("trDataState");
  trLog(t("trSending")+label+" ("+fmtSize(u8.length)+")");
  try{
    trDC.send(JSON.stringify({t:"start",kind:kind,name:name||"",size:u8.length}));
    const CH=16384;
    for(let off=0;off<u8.length;off+=CH){
      while(trDC.bufferedAmount>1048576)await new Promise(r=>setTimeout(r,40));
      trDC.send(u8.subarray(off,Math.min(off+CH,u8.length)));
      trProg(off,u8.length);
    }
    trDC.send(JSON.stringify({t:"done"}));
    trProg(u8.length,u8.length);
    trLog(t("trSent")+label);
  }catch(e){ toast(t("ghErr")+(e.message||""),true); }
}
function trSendState(){
  const data=JSON.stringify({skills:state.skills,notes:state.notes,todos:state.todos,habits:state.habits||[],folders:state.folders||[],dash:state.dash||[]});
  trSendBytes(new TextEncoder().encode(data),"state",null);
}
function trOnMsg(e){
  if(typeof e.data==="string"){
    let m; try{ m=JSON.parse(e.data); }catch(_){ return; }
    if(m.t==="start"){ trRx={buf:[],size:m.size||0,kind:m.kind,name:m.name||"",got:0}; trProg(0,trRx.size); }
    else if(m.t==="done"){
      const u8=new Uint8Array(trRx.got); let o=0;
      trRx.buf.forEach(c=>{ u8.set(new Uint8Array(c),o); o+=c.byteLength; });
      trRx.buf=[];
      if(trRx.kind==="state"){
        try{
          const data=JSON.parse(new TextDecoder().decode(u8));
          trLog(t("trRecvDone")+": "+t("trDataState"));
          confirmDialog(t("trTitle"),t("trApplyAsk")).then(ok=>{
            if(!ok)return;
            state={lang:state.lang,skills:data.skills||[],notes:data.notes||[],todos:data.todos||[],habits:data.habits||[],folders:data.folders||[],dash:data.dash||state.dash,shortcut:state.shortcut};
            save(); currentNoteId=null; renderAll(); toast(t("updatedToast"));
          });
        }catch(err){ toast(t("trBadData"),true); }
      }else{
        const blob=new Blob([u8],{type:"application/octet-stream"});
        const a=document.createElement("a");
        a.href=URL.createObjectURL(blob); a.download=trRx.name||"file";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(a.href),5000);
        trLog(t("trRecvDone")+": "+(trRx.name||"file")+" ("+fmtSize(u8.length)+")");
      }
    }
    return;
  }
  if(e.data instanceof ArrayBuffer){
    trRx.buf.push(e.data); trRx.got+=e.data.byteLength; trProg(trRx.got,trRx.size);
  }
}
function renderTrPanel(){
  const p=$("#tr-panel"); if(!p)return;
  const connected=trDC&&trDC.readyState==="open";
  let h="";
  if(!connected){
    if(trMode==="recv"){
      h+='<div class="tr-step"><div class="tr-step-t">1. '+esc(t("trPasteOffer"))+'</div>'+
        '<textarea id="tr-offer-in" class="tr-code" rows="3" spellcheck="false"></textarea>'+
        '<input id="tr-peer-ip" class="tr-code" style="resize:none" spellcheck="false" placeholder="'+esc(t("trPeerIpPh"))+'" value="'+esc(trPeerIp)+'">'+
        '<div><button class="btn btn-primary" id="tr-mk-answer">'+esc(t("trGenAnswer"))+'</button></div></div>';
      if(trAnswerCode)h+='<div class="tr-step"><div class="tr-step-t">2. '+esc(t("trAnswerCode"))+'</div>'+
        '<textarea id="tr-answer-out" class="tr-code" rows="4" readonly spellcheck="false">'+esc(trAnswerCode)+'</textarea>'+
        '<div><button class="btn" id="tr-copy-answer">'+esc(t("trCopy"))+'</button></div></div>';
    }else{
      h+='<div class="tr-step"><div class="tr-step-t">1. '+esc(t("trOfferCode"))+'</div>';
      if(trOfferCode)h+='<textarea id="tr-offer-out" class="tr-code" rows="4" readonly spellcheck="false">'+esc(trOfferCode)+'</textarea>'+
        '<div><button class="btn" id="tr-copy-offer">'+esc(t("trCopy"))+'</button></div>';
      else h+='<div><button class="btn btn-primary" id="tr-mk-offer">'+esc(t("trGenOffer"))+'</button></div>';
      h+='<div class="tr-step-t" style="margin-top:6px">2. '+esc(t("trPasteAnswer"))+'</div>'+
        '<textarea id="tr-answer-in" class="tr-code" rows="3" spellcheck="false"></textarea>'+
        '<input id="tr-peer-ip" class="tr-code" style="resize:none" spellcheck="false" placeholder="'+esc(t("trPeerIpPh"))+'" value="'+esc(trPeerIp)+'">'+
        '<div><button class="btn btn-primary" id="tr-connect">'+esc(t("trConnect"))+'</button></div></div>';
    }
    h+='<div class="tr-hint">'+esc(t("trSameWifi"))+'</div>';
  }else{
    if(trRole==="send"){
      h+='<div class="tr-session"><button class="btn btn-primary" id="tr-send-state">'+esc(t("trSendData"))+'</button>'+
        '<button class="btn" id="tr-pick">'+esc(t("trSendFile"))+'</button>'+
        '<input type="file" id="tr-file" multiple style="display:none"></div>';
    }else{
      h+='<div class="tr-session tr-wait">'+esc(t("trWaitingRecv"))+'</div>';
    }
    h+='<div id="tr-prog"></div><div id="tr-log" class="tr-log"></div>';
  }
  p.innerHTML=h;
  const on=(id,fn)=>{ const el=$(id); if(el)el.onclick=fn; };
  on("#tr-mk-offer",trGenOffer);
  on("#tr-copy-offer",()=>trCopyTA("#tr-offer-out"));
  on("#tr-connect",trConnectAnswer);
  on("#tr-mk-answer",trGenAnswer);
  on("#tr-copy-answer",()=>trCopyTA("#tr-answer-out"));
  on("#tr-send-state",trSendState);
  on("#tr-pick",()=>{ const f=$("#tr-file"); if(f)f.click(); });
  const tf2=$("#tr-file");
  if(tf2)tf2.onchange=()=>{
    [...tf2.files].forEach(f=>{
      const fr=new FileReader();
      fr.onload=()=>trSendBytes(new Uint8Array(fr.result),"file",f.name);
      fr.readAsArrayBuffer(f);
    });
    tf2.value="";
  };
  setTrStatus(connected?2:(trPC?1:0));
}
$("#tr-seg").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  trCleanup(); trRole=null;
  trMode=b.dataset.v;
  document.querySelectorAll("#tr-seg button").forEach(x=>x.classList.toggle("active",x===b));
  renderTrPanel();
});
$("#btn-tr-close").onclick=()=>{ trCleanup(); setTrStatus(0); renderTrPanel(); };

/* ================= COMMAND PALETTE ================= */
let palOpen=false, palSel=0, palRows=[];
function comboMatch(e){
  const parts=(state.shortcut||"Ctrl+K").toLowerCase().split("+").map(x=>x.trim()).filter(Boolean);
  const key=parts[parts.length-1];
  const mod=parts.includes("mod")||parts.includes("ctrl")||parts.includes("cmd")||parts.includes("meta");
  if(mod!==(e.ctrlKey||e.metaKey))return false;
  if(parts.includes("shift")!==e.shiftKey)return false;
  if(parts.includes("alt")!==e.altKey)return false;
  return e.key.toLowerCase()===key;
}
function buildPalRows(q){
  const cmds=[
    {label:t("cHome"),run:()=>switchView("home")},
    {label:t("cTree"),run:()=>switchView("tree")},
    {label:t("cNotes"),run:()=>switchView("notes")},
    {label:t("cTodo"),run:()=>switchView("todo")},
    {label:t("cCal"),run:()=>switchView("cal")},
    {label:t("cNewNote"),run:()=>{ switchView("notes"); setTimeout(()=>$("#btn-add-note").click(),60); }},
    {label:t("cNewTodo"),run:()=>{ switchView("todo"); setTimeout(()=>$("#todo-input").focus(),60); }},
    {label:t("cNewSkill"),run:()=>openDrawer(null)},
    {label:t("cPush"),run:()=>ghPush()},
    {label:t("cPull"),run:()=>ghPull()},
    {label:t("cSettings"),run:()=>openSettings()}
  ].map(c=>({type:"cmd",label:c.label,sub:"",run:c.run}));
  const items=[];
  [...state.notes].sort((a,b)=>b.updatedAt-a.updatedAt).slice(0,80).forEach(n=>items.push({type:"note",label:n.title||t("untitled"),sub:normFolder(n.folder),run:()=>{ switchView("notes"); currentNoteId=n.id; renderNotes(); }}));
  state.todos.forEach(x=>items.push({type:"task",label:x.text,sub:(x.due||"")+(x.cat?" · "+x.cat:""),run:()=>switchView("todo")}));
  state.skills.forEach(x=>items.push({type:"skill",label:x.name,sub:tierOf(x.level),run:()=>{ switchView("tree"); openDrawer(x.id); }}));
  (state.habits||[]).forEach(x=>items.push({type:"habit",label:x.name,sub:"",run:()=>switchView("home")}));
  const all=[...cmds,...items];
  q=q.trim().toLowerCase();
  if(!q)return all.slice(0,24);
  const score=r=>{
    const hay=(r.label+" "+r.sub).toLowerCase();
    if(hay.startsWith(q))return 3;
    if(hay.includes(q))return 2;
    let i=0; for(const ch of hay){ if(ch===q[i])i++; if(i===q.length)return 1; }
    return 0;
  };
  return all.map(r=>({r,s:score(r)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s||a.r.label.localeCompare(b.r.label)).slice(0,24).map(x=>x.r);
}
function renderPal(){
  const q=$("#pal-input").value;
  palRows=buildPalRows(q);
  palSel=Math.min(palSel,Math.max(0,palRows.length-1));
  const list=$("#pal-list");
  if(!palRows.length){ list.innerHTML='<div class="pal-empty">'+esc(t("scEmpty"))+"</div>"; return; }
  list.innerHTML=palRows.map((r,i)=>'<div class="pal-item'+(i===palSel?" sel":"")+'" data-i="'+i+'"><span class="pal-badge '+r.type+'">'+esc(t("sc"+(r.type==="task"?"Task":r.type[0].toUpperCase()+r.type.slice(1))))+'</span><span class="pal-label">'+esc(r.label)+"</span>"+(r.sub?'<small>'+esc(r.sub)+"</small>":"")+"</div>").join("");
  list.querySelectorAll(".pal-item").forEach(el=>{
    el.onclick=()=>{ const r=palRows[+el.dataset.i]; closePal(); r.run(); };
    el.onmousemove=()=>{ palSel=+el.dataset.i; list.querySelectorAll(".pal-item").forEach((x,i)=>x.classList.toggle("sel",i===palSel)); };
  });
}
function openPal(){
  palOpen=true; palSel=0;
  $("#pal-veil").classList.add("open");
  const inp=$("#pal-input"); inp.value=""; renderPal();
  $("#pal-kbd").textContent="esc";
  setTimeout(()=>inp.focus(),30);
}
function closePal(){ palOpen=false; $("#pal-veil").classList.remove("open"); }
$("#pal-input").addEventListener("input",()=>{ palSel=0; renderPal(); });
$("#pal-input").addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){ e.preventDefault(); palSel=Math.min(palSel+1,palRows.length-1); renderPal(); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); palSel=Math.max(palSel-1,0); renderPal(); }
  else if(e.key==="Enter"){ e.preventDefault(); const r=palRows[palSel]; if(r){ closePal(); r.run(); } }
});
$("#pal-veil").addEventListener("click",e=>{ if(e.target.id==="pal-veil")closePal(); });
document.addEventListener("keydown",e=>{
  if(comboMatch(e)&&!palOpen&&!e.target.closest("input,textarea,select")){ e.preventDefault(); openPal(); }
  else if(e.key==="Escape"&&palOpen)closePal();
});

/* ================= BOTTOM NAV ================= */
document.querySelectorAll(".bn-item").forEach(b=>b.addEventListener("click",()=>{ switchView(b.dataset.view); $("#sidebar").classList.remove("open"); }));

/* ================= MISC BINDINGS ================= */
$("#btn-lang").onclick=e=>{ e.stopPropagation(); $("#lang-wrap").classList.toggle("open"); };
document.addEventListener("click",e=>{ if(!e.target.closest("#lang-wrap"))$("#lang-wrap").classList.remove("open"); });
$("#menu-fab").onclick=()=>$("#sidebar").classList.toggle("open");
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ closeDrawer(); $("#modal-veil").classList.remove("open"); $("#lang-wrap").classList.remove("open"); }
});
window.addEventListener("resize",()=>{ if(currentView==="tree")fitTree(); });

/* ================= RENDER ALL / INIT ================= */
function renderAll(){ renderStats(); renderTree(); renderCards(); renderNotes(); renderTodos(); renderHome(); renderCalendar(); renderDrive(); }
applyI18n();
renderAll();
switchView("home");
