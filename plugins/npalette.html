<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>N Palette</title>
<style>
.np-top{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border-soft);flex-wrap:wrap}
.np-top .tt{font-size:16px;font-weight:700;margin-right:4px;display:flex;align-items:center;gap:7px}
.np-top .tt svg{width:18px;height:18px;stroke:var(--accent)}
.np-tbtn{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.np-tbtn:hover{color:var(--text);border-color:var(--faint)}
.np-tbtn.on{color:var(--accent);border-color:var(--accent);background:var(--accent-dim)}
.np-tbtn:disabled{opacity:.4;pointer-events:none}
.np-tbtn svg{width:14px;height:14px}
.np-tbtn:focus-visible,.np-tabs button:focus-visible,.np-handle:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.np-spacer{flex:1}
#hist{display:block;background:var(--bg-2);border:1px solid var(--border-soft);border-radius:var(--r-sm)}
.np-main{flex:1;min-height:0;min-width:0;position:relative;display:flex;flex-direction:row;overflow:hidden;background:var(--bg-2)}
.np-stage{flex:1;min-width:0;position:relative}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.panning{cursor:grabbing}
.np-zoom{position:absolute;right:10px;bottom:34px;display:flex;flex-direction:column;gap:6px;z-index:5}
.np-zoom button{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.np-zoom button:hover{color:var(--accent);border-color:var(--accent)}
.np-zoom button svg{width:15px;height:15px}
.np-status{position:absolute;left:10px;bottom:8px;font-family:var(--font-mono);font-size:11px;color:var(--faint);z-index:5;background:var(--bg);opacity:.85;padding:2px 8px;border-radius:6px;pointer-events:none}
.np-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9;background:var(--bg-2)}
.np-empty .big{font-size:15px;font-weight:600;color:var(--muted)}
.np-empty .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.np-btn{padding:10px 18px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
.np-btn:hover{color:var(--text);border-color:var(--faint)}
.np-btn.pri{background:var(--accent);border-color:var(--accent);color:#0A0B0D}
.np-btn.pri:hover{filter:brightness(1.08)}
.np-btn.sm{padding:6px 12px;font-size:12px}
/* crop overlay */
.np-cropui{position:absolute;inset:0;z-index:6;display:none}
.np-cropui.on{display:block}
.np-mask{position:absolute;background:rgba(0,0,0,.62)}
.np-sel{position:absolute;border:1.5px solid var(--accent);box-shadow:0 0 0 9999px transparent;cursor:move;touch-action:none}
.np-hd{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--accent);border:2.5px solid #fff;box-sizing:border-box;touch-action:none;z-index:2}
.np-cropbar{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:8px 12px;z-index:7;flex-wrap:wrap;justify-content:center;max-width:94%}
.np-cropbar select{background:var(--bg-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:5px 8px;font-size:12px}
.np-drop{position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);border:3px dashed var(--accent);border-radius:var(--r-md);margin:10px;color:var(--accent);font-size:16px;font-weight:700;pointer-events:none}
.np-drop.on{display:flex}
/* side / drawer panel */
.np-panel{position:relative;width:302px;flex:none;min-height:0;display:flex;flex-direction:column;background:var(--bg);border-left:1px solid var(--border-soft);z-index:8}
.np-handle{display:none}
.np-tabs{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--border-soft);overflow-x:auto;flex:none}
.np-tabs button{padding:7px 11px;font-size:12.5px;font-weight:600;color:var(--faint);border:none;border-bottom:2px solid transparent;background:none;cursor:pointer;white-space:nowrap}
.np-tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.np-body{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 20px}
.np-sec{margin-bottom:16px}
.np-sec-t{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.sl{display:flex;align-items:center;gap:8px;margin:7px 0}
.sl label{width:64px;flex:none;font-size:12.5px;color:var(--muted)}
.sl input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:22px}
.sl output{width:38px;flex:none;text-align:right;font-family:var(--font-mono);font-size:11px;color:var(--faint)}
.sl.mini label{width:52px;font-size:11.5px}
.sl.mini input[type=range]{height:16px}
.sl.mini output{width:32px;font-size:10px}
.hsl-row{display:flex;align-items:center;gap:7px;margin:4px 0 2px}
.hsl-dot{width:14px;height:14px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.25)}
.hsl-name{width:40px;flex:none;font-size:12px;font-weight:600;color:var(--muted)}
.hsl-sl{flex:1;display:flex;flex-direction:column;gap:1px}
.hsl-sl .sl{margin:0}
.hsl-sl .sl label{width:34px;font-size:10px;color:var(--faint)}
.hsl-sl .sl output{width:30px;font-size:9.5px}
/* curves */
.cv-ch{display:flex;gap:4px;margin-bottom:8px}
.cv-ch button{padding:4px 10px;font-size:11.5px;font-weight:700;border-radius:6px;border:1px solid var(--border);color:var(--muted);cursor:pointer;background:var(--surface)}
.cv-ch button.on{color:var(--accent);border-color:var(--accent);background:var(--accent-dim)}
#curveCv{width:100%;height:230px;background:var(--bg-2);border:1px solid var(--border-soft);border-radius:var(--r-sm);touch-action:none;display:block}
.cv-hint{font-size:10.5px;color:var(--faint);margin-top:6px}
.cv-btns{display:flex;gap:8px;margin-top:8px}
/* presets */
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pg button{padding:10px 4px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.pg button:hover{border-color:var(--accent);color:var(--accent)}
.pg button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.pg button:focus-visible{outline:2px solid var(--accent)}
/* export */
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.seg button{padding:6px 13px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{color:var(--accent);border-color:var(--accent);background:var(--accent-dim)}
.exp-note{font-size:11px;color:var(--faint);margin:8px 0;line-height:1.6}
.exp-big{width:100%;padding:12px;font-size:14px;margin-top:10px}
.exp-msg{font-size:12px;color:var(--pass);margin-top:8px;min-height:16px}
/* compare split handle */
.np-splitline{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:5;display:none;pointer-events:none}
.np-splitline::after{content:"◂ ▸";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--accent);color:#0A0B0D;font-size:10px;font-weight:700;padding:4px 6px;border-radius:20px;white-space:nowrap}
.np-splitline.on{display:block}
/* webgl fail */
.np-fail{position:absolute;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:var(--bg);padding:30px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.8}
.np-fail.on{display:flex}
/* mobile: panel becomes bottom drawer */
@media (max-width:720px){
  .np-panel{position:absolute;top:auto;left:0;right:0;bottom:0;width:auto;height:47%;border-left:none;border-top:1px solid var(--border);border-radius:14px 14px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.4)}
  .np-panel.full{height:86%}
  .np-handle{display:block;padding:8px 0 2px;cursor:pointer;touch-action:none;flex:none}
  .np-handle::before{content:"";display:block;width:44px;height:4px;border-radius:4px;background:var(--border);margin:0 auto}
  .np-tabs{padding-top:2px}
  #hist{display:none}
  .np-top{padding:8px 10px;gap:6px}
  .np-tbtn .lb{display:none}
  .np-tbtn{padding:7px 9px}
  .np-zoom{bottom:12px;right:8px}
  .np-status{bottom:auto;top:8px;left:8px}
  .np-empty .row{flex-direction:column;align-items:stretch;width:76%}
}
</style>
</head>

/* ================= curves / LUT ================= */
function catmull(y0,y1,y2,y3,tt){const t2=tt*tt,t3=t2*tt;
  return 0.5*((2*y1)+(-y0+y2)*tt+(2*y0-5*y1+4*y2-y3)*t2+(-y0+3*y1-3*y2+y3)*t3);}
function curveLUT(pts){ // pts sorted by x, 0..1
  const N=256,out=new Uint8Array(N);
  for(let i=0;i<N;i++){
    const x=i/(N-1);let y;
    if(x<=pts[0][0])y=pts[0][1];
    else if(x>=pts[pts.length-1][0])y=pts[pts.length-1][1];
    else{
      let k=0;while(k<pts.length-2&&pts[k+1][0]<x)k++;
      const p0=pts[Math.max(0,k-1)],p1=pts[k],p2=pts[k+1],p3=pts[Math.min(pts.length-1,k+2)];
      const tt=(x-p1[0])/Math.max(1e-6,p2[0]-p1[0]);
      y=catmull(p0[1],p1[1],p2[1],p3[1],Math.max(0,Math.min(1,tt)));
    }
    out[i]=Math.round(Math.max(0,Math.min(1,y))*255);
  }
  return out;
}

    acc+=texture2D(uSrc,s+vec2(-r,0.)*uTexel).rgb+texture2D(uSrc,s+vec2(r,0.)*uTexel).rgb;
    acc+=texture2D(uSrc,s+vec2(0.,-r)*uTexel).rgb+texture2D(uSrc,s+vec2(0.,r)*uTexel).rgb;
    acc+=texture2D(uSrc,s+vec2(-r,-r)*uTexel).rgb+texture2D(uSrc,s+vec2(r,-r)*uTexel).rgb;
    acc+=texture2D(uSrc,s+vec2(-r,r)*uTexel).rgb+texture2D(uSrc,s+vec2(r,r)*uTexel).rgb;
    vec3 blur=acc/12.;
    c=clamp(c+(c-blur)*uSharpen*.09,0.,1.);
  }
  if(uGrain>0.){float g=hash21(floor(gl_FragCoord.xy)+vec2(uSeed*13.7,uSeed*7.31));c=clamp(c+(g-.5)*uGrain*.008,0.,1.);}
  if(uClip>0.){float th=1.-uClip*.0099;c=min(c,th)/max(th,.05);}
  if(uVig>0.){
    vec2 d=vUv-.5;d.x*=uCan.x/uCan.y;
    c*=1.-uVig*.01*(1.-smoothstep(.35,.95,length(d)));
  }
  c=clamp(c+uChOff*.002,0.,1.);
  gl_FragColor=vec4(c,1.);
}`;

function mkTex(unit){const tx=gl.createTexture();gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,tx);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);return tx;}

function initGL(){
  gl=glc.getContext("webgl",{preserveDrawingBuffer:true})||glc.getContext("experimental-webgl");
  if(!gl)return false;
  maxTex=gl.getParameter(gl.MAX_TEXTURE_SIZE)||4096;
  const vs=gl.createShader(gl.VERTEX_SHADER);gl.shaderSource(vs,VSRC);gl.compileShader(vs);
  const fs=gl.createShader(gl.FRAGMENT_SHADER);gl.shaderSource(fs,FSRC);gl.compileShader(fs);
  if(!gl.getShaderParameter(fs,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(fs));return false;}
  prog=gl.createProgram();gl.attachShader(prog,vs);gl.attachShader(prog,fs);gl.linkProgram(prog);gl.useProgram(prog);
  posBuf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,posBuf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const aP=gl.getAttribLocation(prog,"aP");gl.enableVertexAttribArray(aP);gl.vertexAttribPointer(aP,2,gl.FLOAT,false,0,0);
  srcTex=mkTex(0);lutTex=mkTex(1);
  gl.uniform1i(gl.getUniformLocation(prog,"uSrc"),0);
  gl.uniform1i(gl.getUniformLocation(prog,"uLut"),1);
  // histogram / export FBO
  histTexG=gl.createTexture();gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,histTexG);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  histFBO=gl.createFramebuffer();
  return true;
}

/* display rect D (oriented space) */
function dispRect(){return S.crop||{x:0,y:0,w:1,h:1};}
function orientedSize(){return (S.rot%2===1)?{w:ih,h:iw}:{w:iw,h:ih};}
function canvasCss(){return{w:glc.clientWidth||1,h:glc.clientHeight||1};}

function effCanvas(){
  const cv=canvasCss();
  const pn=$("#panel");
  if(innerWidth<=720&&pn&&getComputedStyle(pn).position==="absolute"){
    const ph=pn.getBoundingClientRect().height||0;
    const st=document.querySelector(".np-stage");
    const sh=st?st.getBoundingClientRect().height:cv.h;
    return{w:cv.w,h:Math.max(80,sh-ph)};
  }
  return cv;
}
function fitView(){
  const D=dispRect(),os=orientedSize(),cv=effCanvas();
  const A=(D.w*os.w)/(D.h*os.h);
  let fx=1,fy=fx*A*cv.h/cv.w;
  if(fy>1){fy=1;fx=fy*cv.w/(cv.h*Math.max(A,1e-6));}
  fitFx=fx;
  view.cx=D.x+D.w/2;view.cy=D.y+D.h/2;view.fx=fx;view.fy=fy;
  updateStatus();
}
let rszT=0;
function refitNow(){
  if(!srcImg)return;
  const z=Math.max(fitFx/Math.max(view.fx,1e-9),1);
  const cx=view.cx,cy=view.cy;
  fitView();
  view.fx=fitFx/z;view.fy=view.fy/z;
  view.cx=cx;view.cy=cy;
  render();layoutCropIf();
}
function refitLater(){clearTimeout(rszT);rszT=setTimeout(refitNow,120);}

function hsl2rgb(h,s,l){
  h=((h%360)+360)%360/360;
  const q=l<.5?l*(1+s):l+s-l*s,p=2*l-q,f=x=>{x=((x%1)+1)%1;if(x<1/6)return p+(q-p)*6*x;if(x<.5)return q;if(x<2/3)return p+(q-p)*(2/3-x)*6;return p;};
  return[f(h+1/3),f(h),f(h-1/3)];
}
const TARGET_HUE=[0,30,60,120,180,240,280,330];

let seed=1;
function uploadUniforms(W,H){
  const D=dispRect();
  const u=n=>gl.getUniformLocation(prog,n);
  gl.uniform4f(u("uDisp"),D.x,D.y,D.w,D.h);
  gl.uniform4f(u("uView"),view.cx,view.cy,view.fx,view.fy);
  gl.uniform1f(u("uRot"),S.rot);
  gl.uniform2f(u("uFlip"),S.flipX,S.flipY);

  gl.uniform1f(u("uBright"),S.tone.bright);gl.uniform1f(u("uContrast"),S.tone.contrast);
  gl.uniform1f(u("uExposure"),S.tone.exposure);gl.uniform1f(u("uGamma"),S.tone.gamma/100);
  gl.uniform1f(u("uHigh"),S.tone.highlight);gl.uniform1f(u("uShadow"),S.tone.shadow);
  gl.uniform1f(u("uWhite"),S.tone.white);gl.uniform1f(u("uBlack"),S.tone.black);
  gl.uniform1f(u("uTemp"),S.color.temp);gl.uniform1f(u("uTint"),S.color.tint);
  gl.uniform1f(u("uHueRot"),S.color.hue);gl.uniform1f(u("uSat"),S.color.sat);
  gl.uniform1f(u("uVSat"),S.color.vsat);gl.uniform1f(u("uSepia"),S.color.sepia);
  const th=new Float32Array(16),tsh=new Float32Array(8),tsa=new Float32Array(8),tlu=new Float32Array(8);
  for(let i=0;i<8;i++){
    const r=TARGET_HUE[i]*Math.PI/180;
    th[i*2]=Math.cos(r);th[i*2+1]=Math.sin(r);
    tsh[i]=S.hsl.h[i];tsa[i]=S.hsl.s[i];tlu[i]=S.hsl.l[i];
  }
  gl.uniform2fv(u("uTHue[0]"),th);gl.uniform1fv(u("uTSh[0]"),tsh);
  gl.uniform1fv(u("uTSa[0]"),tsa);gl.uniform1fv(u("uTLu[0]"),tlu);
  const sc=new Float32Array(9),sw=new Float32Array(3);
  const zones=[["sh","ss"],["mh","ms"],["hh","hs"]];
  for(let i=0;i<3;i++){
    const col=hsl2rgb(S.split[zones[i][0]],1,.5);
    sc[i*3]=col[0];sc[i*3+1]=col[1];sc[i*3+2]=col[2];
    sw[i]=Math.max(0,Math.min(1,S.split[zones[i][1]]/100));
  }
  gl.uniform3fv(u("uSCol[0]"),sc);gl.uniform1fv(u("uSW[0]"),sw);
    gl.uniform1f(u("uSharpen"),S.fx.sharpen);gl.uniform1f(u("uRadius"),Math.max(.5,S.fx.radius/100));
  gl.uniform1f(u("uGrain"),S.fx.grain);gl.uniform1f(u("uClip"),S.fx.clip);
  gl.uniform1f(u("uVig"),S.fx.vig);
  gl.uniform3f(u("uChOff"),S.fx.r,S.fx.g,S.fx.b);
  gl.uniform2f(u("uTexel"),1/ow,1/oh);
  gl.uniform1f(u("uSeed"),seed);
  const dpr=window.devicePixelRatio||1;
  gl.uniform1f(u("uSplitPx"),compareOn?splitPxCss*dpr:-1);
  gl.uniform2f(u("uCan"),W,H);
}

function render(){
  if(!glOK||!srcImg)return;
  const dpr=window.devicePixelRatio||1;
  const W=Math.round(glc.clientWidth*dpr),H=Math.round(glc.clientHeight*dpr);
  if(glc.width!==W||glc.height!==H){glc.width=W;glc.height=H;}
  gl.viewport(0,0,W,H);
  uploadUniforms(W,H);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,srcTex);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,lutTex);
  gl.drawArrays(gl.TRIANGLES,0,3);
  updateStatus();
  histSoon();
}

/* histogram via small FBO render + readPixels */
let histQueued=false;
function histSoon(){if(!glOK||histQueued)return;histQueued=true;requestAnimationFrame(()=>{histQueued=false;renderHistogram();});}
function renderHistogram(){
  if(!glOK||!srcImg)return;
  gl.bindFramebuffer(gl.FRAMEBUFFER,histFBO);
  gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,histTexG);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,histW,histH,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,histTexG,0);
  gl.viewport(0,0,histW,histH);
  const D=dispRect();
  const oldView={...view};
  view.cx=D.x+D.w/2;view.cy=D.y+D.h/2;view.fx=D.w;view.fy=D.h;
  uploadUniforms(histW,histH);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,srcTex);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,lutTex);
  gl.drawArrays(gl.TRIANGLES,0,3);
  const px=new Uint8Array(histW*histH*4);
  gl.readPixels(0,0,histW,histH,gl.RGBA,gl.UNSIGNED_BYTE,px);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  Object.assign(view,oldView);
  render();
  drawHistCanvas(px);
}
function drawHistCanvas(px){
  const cv=$("#hist"),cx2=cv.getContext("2d");
  const W=cv.width,H=cv.height;
  cx2.clearRect(0,0,W,H);
  cx2.fillStyle="rgba(255,255,255,.04)";
  for(let g=1;g<4;g++){cx2.fillRect(0,g*H/4,W,1);}
  const bins=new Float32Array(4*256);
  const step=4;
  for(let i=0;i<px.length;i+=step*4){
    const r=px[i],g=px[i+1],b=px[i+2];
    bins[r]++;bins[256+g]++;bins[512+b]++;
    bins[768+Math.round(r*.299+g*.587+b*.114)]++;
  }
  const cols=["rgba(229,72,77,.75)","rgba(48,164,108,.75)","rgba(31,111,235,.75)","rgba(255,255,255,.5)"];
  for(let ch=0;ch<4;ch++){
    let mx=1;for(let i=0;i<256;i++)if(bins[ch*256+i]>mx)mx=bins[ch*256+i];
    cx2.strokeStyle=cols[ch];cx2.lineWidth=1;cx2.beginPath();
    for(let i=0;i<256;i+=2){
      const x=i/256*W,y=H-2-(bins[ch*256+i]/mx)*(H-6);
      i===0?cx2.moveTo(x,y):cx2.lineTo(x,y);
    }
    cx2.stroke();
  }
}

const EXP={fmt:"png",quality:92,size:1};
function exportImage(){
  if(!srcImg){toast(t("needImg"),true);return;}
  const D=dispRect(),os=orientedSize();
  let W=Math.max(1,Math.round(D.w*os.w*EXP.size));
  let H=Math.max(1,Math.round(D.h*os.h*EXP.size));
  let note="";
  const mx=Math.max(W,H);
  if(mx>maxTex){const k=maxTex/mx;W=Math.round(W*k);H=Math.round(H*k);note=tf("tooBig",{w:W,h:H});}
  gl.bindFramebuffer(gl.FRAMEBUFFER,histFBO);
  gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,histTexG);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,W,H,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,histTexG,0);
  gl.viewport(0,0,W,H);
  const ov={...view};
  view.cx=D.x+D.w/2;view.cy=D.y+D.h/2;view.fx=D.w;view.fy=D.h;
  uploadUniforms(W,H);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,srcTex);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,lutTex);
  gl.drawArrays(gl.TRIANGLES,0,3);
  const px=new Uint8Array(W*H*4);
  gl.readPixels(0,0,W,H,gl.RGBA,gl.UNSIGNED_BYTE,px);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  Object.assign(view,ov);render();
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;
  const cx2=cv.getContext("2d");
  const img=cx2.createImageData(W,H);
  for(let y=0;y<H;y++){img.data.set(px.subarray((H-1-y)*W*4,(H-y)*W*4),y*W*4);}
  cx2.putImageData(img,0,0);
  const mime=EXP.fmt==="png"?"image/png":EXP.fmt==="jpeg"?"image/jpeg":"image/webp";
  cv.toBlob(blob=>{
    if(!blob){toast(t("expFail")+"toBlob",true);return;}
    const rd=new FileReader();
    rd.onload=async()=>{
      const base64=String(rd.result).split(",")[1];
      const dot=srcName.lastIndexOf(".");
      const stem=dot>0?srcName.slice(0,dot):srcName;
      try{await np.call("saveFile",{name:stem+"-edited."+(EXP.fmt==="jpeg"?"jpg":EXP.fmt),base64});
        toast(note?note:tf("loaded",{name:stem+"-edited."+EXP.fmt}));
        if(note)toast(note);
        $("#expMsg").textContent=(note?note+" · ":"")+W+"×"+H;
      }catch(e){toast(t("expFail")+(e.message||""),true);}
    };
    rd.readAsDataURL(blob);
  },mime,EXP.quality/100);
}

function smoothCurve(){
  const pts=S.curves[curveCh];
  if(pts.length<3)return;
  const ys=pts.map(p=>p[1]);
  for(let i=1;i<pts.length-1;i++)pts[i][1]=Math.max(0,Math.min(1,(ys[i-1]+ys[i]*2+ys[i+1])/4));
}
function drawCurve(){
  const cv=$("#curveCv");if(!cv)return;
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth||250,H=230;
  cv.width=W*dpr;cv.height=H*dpr;
  const c=cv.getContext("2d");c.scale(dpr,dpr);
  c.clearRect(0,0,W,H);
  c.strokeStyle="rgba(255,255,255,.07)";c.lineWidth=1;
  for(let i=1;i<4;i++){c.beginPath();c.moveTo(0,i*H/4);c.lineTo(W,i*H/4);c.stroke();c.beginPath();c.moveTo(i*W/4,0);c.lineTo(i*W/4,H);c.stroke();}
  c.strokeStyle="rgba(255,255,255,.18)";
  c.beginPath();c.moveTo(0,H);c.lineTo(W,0);c.stroke();
  const pts=S.curves[curveCh];
  const X=x=>x*W,Y=y=>(1-y)*H;
  c.strokeStyle=curveCh==="R"?"#E5484D":curveCh==="G"?"#30A46C":curveCh==="B"?"#1F6FEB":"#FFC53D";
  c.lineWidth=1.6;c.beginPath();
  for(let i=0;i<=255;i+=2){
    const x=i/255;
    let y;
    if(x<=pts[0][0])y=pts[0][1];
    else if(x>=pts[pts.length-1][0])y=pts[pts.length-1][1];
    else{
      let k=0;while(k<pts.length-2&&pts[k+1][0]<x)k++;
      const p0=pts[Math.max(0,k-1)],p1=pts[k],p2=pts[k+1],p3=pts[Math.min(pts.length-1,k+2)];
      const tt=Math.max(0,Math.min(1,(x-p1[0])/Math.max(1e-6,p2[0]-p1[0])));
      y=catmull(p0[1],p1[1],p2[1],p3[1],tt);
    }
    i===0?c.moveTo(X(x),Y(y)):c.lineTo(X(x),Y(y));
  }
  c.stroke();
  pts.forEach((p,i)=>{
    c.beginPath();c.arc(X(p[0]),Y(p[1]),i===0||i===pts.length-1?4.5:5.5,0,7);
    c.fillStyle=(i===0||i===pts.length-1)?"var(--surface)":"#fff";c.fillStyle=i===0||i===pts.length-1?"#888":"#fff";
    c.fill();c.strokeStyle="#0A0B0D";c.lineWidth=1.5;c.stroke();
  });
}
function bindCurveEvents(cv){
  let dragI=-1,moved=false,beforeSnap=null;
  const toPt=e=>{
    const r=cv.getBoundingClientRect();
    return[Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,1-(e.clientY-r.top)/r.height))];
  };
  const pts=()=>S.curves[curveCh];
  cv.onpointerdown=e=>{
    cv.setPointerCapture(e.pointerId);
    const[x,y]=toPt(e);
    const p=pts();dragI=-1;
    let best=.02;
    p.forEach((pt,i)=>{const d=Math.hypot(pt[0]-x,pt[1]-y);if(d<best){best=d;dragI=i;}});
    if(dragI<0){
      if(x<=p[0][0]||x>=p[p.length-1][0])return;
      const before=snapState();
      p.push([x,y]);sortPts();dragI=p.findIndex(pt=>pt[0]===x&&pt[1]===y);
      pushHist(before);bakeLuts();drawCurve();render();histSoon();
    }
    moved=false;beforeSnap=snapState();
  };
  cv.onpointermove=e=>{
    if(dragI<0)return;
    const[x,y]=toPt(e);
    const p=pts();
    const isEnd=dragI===0||dragI===p.length-1;
    if(isEnd){p[dragI][1]=y;}
    else{
      const minX=(p[dragI-1][0]+(dragI>1?p[dragI-1][0]:0))/2+0.004;
      const maxX=(p[dragI+1][0]+(dragI<p.length-2?p[dragI+1][0]:1))/2-0.004;
      p[dragI][0]=Math.max(Math.max(0.002,minX+0.002),Math.min(Math.min(0.998,maxX),x));
      p[dragI][1]=y;
    }
    moved=true;
    bakeLuts();drawCurve();render();histSoon();
  };
  cv.onpointerup=()=>{if(dragI>=0&&moved)pushHist(beforeSnap);dragI=-1;beforeSnap=null;};
  cv.ondblclick=e=>{
    const[x]=toPt(e);
    const p=pts();
    if(p.length<=2)return;
    let bi=-1,bd=.02;
    p.forEach((pt,i)=>{if(i===0||i===p.length-1)return;const d=Math.abs(pt[0]-x);if(d<bd){bd=d;bi=i;}});
    if(bi>0){pushHist();p.splice(bi,1);bakeLuts();drawCurve();render();histSoon();}
  };
}
function sortPts(){S.curves[curveCh].sort((a,b)=>a[0]-b[0]);}

/* ================= view: zoom / pan / compare ================= */
function cssToOriented(cx2,cy2){
  const cv=canvasCss();
  const vx=cx2/cv.w-.5,vy=.5-cy2/cv.h;
  return[view.cx+vx*view.fx,view.cy+vy*view.fy];
}
function zoomAt(cx2,cy2,f){
  const o=cssToOriented(cx2,cy2);
  view.fx/=f;view.fy/=f;
  if(view.fx>8){view.fy*=8/view.fx;view.fx=8;}
  view.cx=o[0]-(cx2/canvasCss().w-.5)*view.fx;
  view.cy=o[1]-(.5-cy2/canvasCss().h)*view.fy;
  render();
}
function zoomCenter(f){zoomAt(canvasCss().w/2,canvasCss().h/2,f);}
function updateStatus(){
  const pct=Math.round(fitFx/view.fx*100);
  $("#status").textContent=srcImg?pct+"% · "+iw+"×"+ih:"";

}
function bindView(){
  glc.addEventListener("wheel",e=>{
    e.preventDefault();

    const r=glc.getBoundingClientRect();
    zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.12:1/1.12);
  },{passive:false});
  let mode=null,lx=0,ly=0;
  glc.addEventListener("pointerdown",e=>{
    if(!srcImg)return;
    glc.setPointerCapture(e.pointerId);
    const r=glc.getBoundingClientRect();
    lx=e.clientX-r.left;ly=e.clientY-r.top;
    mode=compareOn?"split":"pan";
    glc.classList.add("panning");
    if(compareOn){splitPxCss=lx;render();}
  });
  glc.addEventListener("pointermove",e=>{
    if(!mode)return;
    const r=glc.getBoundingClientRect();
    const x=e.clientX-r.left,y=e.clientY-r.top;
    if(mode==="pan"){
      const cv=canvasCss();
      view.cx-=(x-lx)/cv.w*view.fx;
      view.cy+=(y-ly)/cv.h*view.fy;
      lx=x;ly=y;render();
    }else if(mode==="split"){splitPxCss=x;render();}
  });
  const up=()=>{mode=null;glc.classList.remove("panning");};
  glc.addEventListener("pointerup",up);glc.addEventListener("pointercancel",up);

  $("#z-out").onclick=()=>srcImg&&zoomCenter(1/1.25);

const cropSel={x:0,y:0,w:0,h:0}; // canvas css px
let cropRatio="free";
function bindCrop(){
  const ratios=[["free",t("ratioFree")],["1:1","1:1"],["4:3","4:3"],["3:2","3:2"],["16:9","16:9"],["9:16","9:16"]];
  const sel=$("#cropRatio");
  sel.innerHTML=ratios.map(r=>`<option value="${r[0]}">${r[0]==="free"?t("ratioFree"):r[1]}</option>`).join("");
  sel.onchange=()=>{cropRatio=sel.value;initCropSel();};
  $("#cropApply").onclick=applyCrop;
  $("#cropCancel").onclick=exitCrop;
}
function enterCrop(){
  if(!srcImg){toast(t("needImg"),true);return;}
  $("#cropUI").classList.add("on");$("#bt-crop").classList.add("on");
  initCropSel();
}
function exitCrop(){
  $("#cropUI").classList.remove("on");$("#bt-crop").classList.remove("on");
}
function initCropSel(){
  const cv=canvasCss();
  const m=Math.min(cv.w,cv.h)*0.14;
  cropSel.x=m;cropSel.y=m;cropSel.w=cv.w-2*m;cropSel.h=cv.h-2*m;
  applyRatio(false);layoutCrop();
}
function ratioVal(){return cropRatio==="free"?0:eval(cropRatio.replace(":","/"));}
function applyRatio(grow){
  const r=ratioVal();if(!r)return;
  let w=cropSel.w,h=w/r;
  if(h>cropSel.h){h=cropSel.h;w=h*r;}
  cropSel.w=w;cropSel.h=h;
  const cv=canvasCss();
  cropSel.x=Math.max(0,Math.min(cv.w-w,cropSel.x));
  cropSel.y=Math.max(0,Math.min(cv.h-h,cropSel.y));
}
function layoutCrop(){
  const{cv}=0||{}; // noop
  const sel=$("#csel");
  sel.style.left=cropSel.x+"px";sel.style.top=cropSel.y+"px";
  sel.style.width=cropSel.w+"px";sel.style.height=cropSel.h+"px";
  const t=$("#cm-t"),b=$("#cm-b"),l=$("#cm-l"),r=$("#cm-r");
  t.style.left="0";t.style.top="0";t.style.right="0";t.style.height=Math.max(0,cropSel.y)+"px";
  b.style.left="0";b.style.bottom="0";b.style.right="0";b.style.height=Math.max(0,canvasCss().h-cropSel.y-cropSel.h)+"px";
  l.style.left="0";l.style.top=cropSel.y+"px";l.style.width=Math.max(0,cropSel.x)+"px";l.style.height=cropSel.h+"px";
  r.style.right="0";r.style.top=cropSel.y+"px";r.style.width=Math.max(0,canvasCss().w-cropSel.x-cropSel.w)+"px";r.style.height=cropSel.h+"px";
}
function bindCropDrag(){
  let mode=null,ox=0,oy=0,ostart=null;
  const start=(e,hd)=>{
    mode=hd||"move";
    $("#csel").setPointerCapture(e.pointerId);
    const r=$("#cropUI").getBoundingClientRect();
    ox=e.clientX-r.left;oy=e.clientY-r.top;
    ostart={...cropSel};
    e.preventDefault();e.stopPropagation();
  };
  $("#csel").addEventListener("pointerdown",e=>start(e,null));
  document.querySelectorAll(".np-hd").forEach(hd=>{
    hd.addEventListener("pointerdown",e=>start(e,hd.dataset.hd));
  });
  const csel=$("#csel");
  csel.addEventListener("pointermove",e=>{
    if(!mode)return;
    const r=$("#cropUI").getBoundingClientRect();
    const x=e.clientX-r.left,y=e.clientY-r.top;
    const dx=x-ox,dy=y-oy;
    const cv=canvasCss();
    if(mode==="move"){
      cropSel.x=Math.max(0,Math.min(cv.w-cropSel.w,ostart.x+dx));
      cropSel.y=Math.max(0,Math.min(cv.h-cropSel.h,ostart.y+dy));
    }else{
      let{nx,ny,nw,nh}=0||{};
      let X=ostart.x,Y=ostart.y,W=ostart.w,H=ostart.h;
      if(mode.includes("l")){const d=Math.max(-ostart.x,Math.min(dx,ostart.w-24));X=ostart.x+d;W=ostart.w-d;}
      if(mode.includes("r")){W=Math.max(24,Math.min(cv.w-ostart.x,ostart.w+dx));}
      if(mode.includes("t")){const d=Math.max(-ostart.y,Math.min(dy,ostart.h-24));Y=ostart.y+d;H=ostart.h-d;}
      if(mode.includes("b")){H=Math.max(24,Math.min(cv.h-ostart.y,ostart.h+dy));}
      const r2=ratioVal();
      if(r2){
        if(mode.includes("l")||mode.includes("r"))H=W/r2;else W=H*r2;
        if(mode.includes("l"))X=ostart.x+ostart.w-W;
        if(mode.includes("t"))Y=ostart.y+ostart.h-H;
      }
      cropSel.x=X;cropSel.y=Y;cropSel.w=W;cropSel.h=H;
    }
    layoutCrop();
  });
  csel.addEventListener("pointerup",()=>{mode=null;});
}
function applyCrop(){
  const cv=canvasCss();
  const[o1x,o1y]=cssToOriented(cropSel.x,cropSel.y);
  const[o2x,o2y]=cssToOriented(cropSel.x+cropSel.w,cropSel.y+cropSel.h);
  const D=dispRect();
  let nx=Math.max(D.x,Math.min(o1x,o2x));
  let ny=Math.max(D.y,Math.min(o1y,o2y));
  let nx2=Math.min(D.x+D.w,Math.max(o1x,o2x));
  let ny2=Math.min(D.y+D.h,Math.max(o1y,o2y));
  if(nx2-nx<0.02||ny2-ny<0.02){exitCrop();return;}
  pushHist();
  S.crop={x:nx,y:ny,w:nx2-nx,h:ny2-ny};
  exitCrop();fitView();render();histSoon();
}

    const dy=dragY-e.clientY;if(Math.abs(dy)>4)dragMoved=true;
    const mh=$("#npMain").clientHeight;
    const h=Math.max(mh*.2,Math.min(mh*.9,startH+dy));
    panel.style.height=(h/mh*100)+"%";
    panel.classList.remove("full");
  });
  handle.addEventListener("pointerup",()=>{dragY=null;setTimeout(()=>dragMoved=false,50);refitLater();});
}

/* ================= i18n apply + boot ================= */
function applyLang(){
  document.documentElement.lang=L;
  const map={"lb-open":"open","lb-cmp":"cmp","lb-crop":"crop","emptyT":"emptyT","em-open":"open","em-s1":"s1","em-s2":"s2","cropApply":"apply","cropCancel":"cancel"};
  for(const id in map){const e=document.getElementById(id);if(e)e.textContent=t(map[id]);}
  $("#npTitle").textContent=t("tabColor")==="Color"?"N Palette":"N调色";
  $("#handle").setAttribute("aria-label",t("handle"));
  buildTabs();buildBody();
  const ratios=$("#cropRatio");
  if(ratios&&ratios.options.length)ratios.options[0].text=t("ratioFree");
}
function webglFallback(){
  glOK=false;
  $("#fail").classList.add("on");
  $("#fail").textContent=t("webglFail");
  toast(t("webglFail"),true);
  const c2=glc.getContext("2d");
  window.__draw2d=()=>{
    if(!srcImg)return;
    const cv=canvasCss();
    glc.width=cv.w*(window.devicePixelRatio||1);glc.height=cv.h*(window.devicePixelRatio||1);
    const os=orientedSize();
    const sc=Math.min(cv.w/os.w,cv.h/os.h);
    const w=os.w*sc,h=os.h*sc;
    c2.save();c2.clearRect(0,0,cv.w,cv.h);
    c2.translate(cv.w/2,cv.h/2);
    c2.rotate(S.rot*Math.PI/2);
    c2.scale(S.flipX?-1:1,S.flipY?-1:1);
    c2.drawImage(srcImg,-w/2,-h/2,w,h);
    c2.restore();
  };
  const origLoad=loadImage;
  loadImage=(img,name)=>{origLoad(img,name);window.__draw2d();
    $("#panel").style.pointerEvents="none";$("#panel").style.opacity=".45";
    document.querySelector(".np-zoom").style.display="none";};
  const origFit=fitView;
  fitView=()=>{origFit();if(srcImg)window.__draw2d&&window.__draw2d();updateStatus();};
  window.addEventListener("resize",()=>window.__draw2d&&window.__draw2d());
}

(async function boot(){
  let env={lang:"zh"};
  try{env=await np.call("getEnv");}catch(_){}
  L=(env.lang&&I18N[env.lang])?env.lang:"zh";
  glOK=initGL();
  bakeLuts();
  applyLang();
  bindTop();bindView();bindCrop();bindCropDrag();bindIO();bindDrawer();
  window.addEventListener("resize",refitLater);
  if(window.visualViewport)window.visualViewport.addEventListener("resize",refitLater);
  if(!glOK)webglFallback();
})();
function layoutCropIf(){if($("#cropUI").classList.contains("on"))layoutCrop();}
</script>
